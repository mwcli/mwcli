# Copy and edit this file as config.yml in the mw configuration directory.
sites:
  default: zetawiki
farms:
  archwiki:
    - host: wiki.archlinux.org
      aliases: [arch, archwiki]
      api: https://wiki.archlinux.org/api.php
  zetawiki:
    - host: zetawiki.com
      aliases: [zeta, zetawiki]
      api: https://zetawiki.com/w/api.php
# Run `mw auth login --wiki archwiki` or `mw auth login --wiki zetawiki`
# to store credentials for either farm.
