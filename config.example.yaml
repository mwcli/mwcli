# Copy this file to config.yml in the mw configuration directory.
# A first login sets the default site automatically.
# sites:
#   default: zetawiki
farms:
  zetawiki:
    - host: zetawiki.com
      aliases: [zeta, zetawiki]
      api: https://zetawiki.com/w/api.php
  # Add another farm if you use more than one wiki account scope.
  # archwiki:
  #   - host: wiki.archlinux.org
  #     aliases: [arch, archwiki]
  #     api: https://wiki.archlinux.org/api.php
# Run `mw auth login --wiki zetawiki` to log in.
# If enabled above, use `mw auth login --wiki archwiki` for ArchWiki.
