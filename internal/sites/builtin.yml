# Built-in farms and their wiki API endpoints.
# An omitted api uses https://<host>/w/api.php.
farms:
  wikimedia:
    - host: commons.wikimedia.org
      aliases: [commons]
    - host: en.wikipedia.org
      aliases: [wikipedia.org, wikipedia]
    - host: en.wikibooks.org
      aliases: [wikibooks]
    - host: en.wikiquote.org
      aliases: [wikiquote]
    - host: en.wikiversity.org
      aliases: [wikiversity]
    - host: en.wikivoyage.org
      aliases: [wikivoyage]
    - host: en.wiktionary.org
      aliases: [wiktionary, wikt]
    - host: foundation.wikimedia.org
      aliases: [wikimedia]
    - host: meta.wikimedia.org
      aliases: [meta, metawikimedia]
    - host: species.wikimedia.org
      aliases: [species, wikispecies]
    - host: wikisource.org
      aliases: [wikisource]
    - host: www.mediawiki.org
      aliases: [mediawiki, mediawiki.org, mediawikiwiki, mw]
    - host: www.wikidata.org
      aliases: [wikidata.org, wikidata]
  uncyclopedia:
    - host: en.uncyclopedia.co
      aliases: [uncyclopedia]
  memoryalpha:
    - host: memory-alpha.fandom.com
      aliases: [memoryalpha]
  tmbw:
    - host: tmbw.net
      aliases: [tmbw]
      api: https://tmbw.net/wiki/api.php
  mozilla:
    - host: wiki.mozilla.org
      aliases: [mozilla, mozillawiki]
      api: https://wiki.mozilla.org/api.php
  shoutwiki:
    - host: www.shoutwiki.com
      aliases: [shout, shoutwiki]
      api: https://www.shoutwiki.com/w/api.php
  archwiki:
    - host: wiki.archlinux.org
      aliases: [arch, archwiki]
      api: https://wiki.archlinux.org/api.php
  zetawiki:
    - host: zetawiki.com
      aliases: [zeta, zetawiki]
  wikihow:
    - host: www.wikihow.com
      aliases: [wikihow]
      api: https://www.wikihow.com/api.php
