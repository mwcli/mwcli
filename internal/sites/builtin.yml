# Built-in farms and their wiki API endpoints.
# An omitted api uses https://<host>/w/api.php. A host such as *.wikipedia.org
# is a pattern for one more label in front, such as ko.wikipedia.org; its api
# may use {host}. Wikis named exactly come first, for their aliases.
farms:
  memoryalpha:
    - host: memory-alpha.fandom.com
      aliases: [memoryalpha]
  mozilla:
    - host: wiki.mozilla.org
      aliases: [mozilla, mozillawiki]
      api: https://wiki.mozilla.org/api.php
  shoutwiki:
    - host: www.shoutwiki.com
      aliases: [shout, shoutwiki]
      api: https://www.shoutwiki.com/w/api.php
  tmbw:
    - host: tmbw.net
      aliases: [tmbw]
      api: https://tmbw.net/wiki/api.php
  uncyclopedia:
    - host: en.uncyclopedia.co
      aliases: [uncyclopedia]
  wikihow:
    - host: www.wikihow.com
      aliases: [wikihow]
      api: https://www.wikihow.com/api.php
  wikimedia:
    - host: commons.wikimedia.org
      aliases: [commons]
    - host: en.wikibooks.org
      aliases: [wikibooks]
    - host: en.wikipedia.org
      aliases: [wikipedia.org, wikipedia, enwiki]
    - host: ja.wikipedia.org
      aliases: [jawiki]
    - host: ko.wikipedia.org
      aliases: [kowiki]
    - host: en.wikiquote.org
      aliases: [wikiquote]
    - host: en.wikiversity.org
      aliases: [wikiversity]
    - host: en.wikivoyage.org
      aliases: [wikivoyage]
    - host: en.wiktionary.org
      aliases: [wiktionary, wikt]
    - host: foundation.wikimedia.org
      aliases: [wikimedia]
    - host: meta.wikimedia.org
      aliases: [meta, metawikimedia]
    - host: species.wikimedia.org
      aliases: [species, wikispecies]
    - host: wikisource.org
      aliases: [wikisource]
    - host: www.mediawiki.org
      aliases: [mediawiki, mediawiki.org, mediawikiwiki, mw]
    - host: www.wikidata.org
      aliases: [wikidata.org, wikidata]
    # The language editions of the projects. *.wikimedia.org is not a pattern:
    # some of its hosts, such as phabricator.wikimedia.org, are not wikis.
    - host: "*.wikipedia.org"
    - host: "*.wiktionary.org"
    - host: "*.wikibooks.org"
    - host: "*.wikiquote.org"
    - host: "*.wikisource.org"
    - host: "*.wikinews.org"
    - host: "*.wikiversity.org"
    - host: "*.wikivoyage.org"
